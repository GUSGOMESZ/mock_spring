# Pratica 4 - Observabilidade: Prometheus (coleta) + Grafana (visualizacao)
# A aplicacao Spring roda FORA do Docker (mvn spring-boot:run) na porta 8081.
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mock-spring-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mock-spring-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
