spring.application.name=teste-unidade-2

# Porta 8081 (a 8080 fica com o Jenkins da A2)
server.port=8081

# ===== Pratica 4: Observabilidade =====
# Endpoints do Actuator expostos via HTTP
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Tag comum em todas as metricas (facilita filtrar no Grafana)
management.metrics.tags.application=mock-spring

# Histograma das requisicoes HTTP (permite calcular p95/p99 no Grafana)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
